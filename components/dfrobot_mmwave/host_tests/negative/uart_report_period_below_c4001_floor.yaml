# expect: uart_report_period must be between 0.2 and 1500 on the SEN0609, got 0.1
packages:
  base: !include _base.yaml
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
dfrobot_mmwave:
  id: radar
  model: SEN0609
esphome:
  name: mmwave-negative
  on_boot:
    then:
      - dfrobot_mmwave.set_parameter:
          id: radar
          parameter: uart_report_period
          value: 0.1
