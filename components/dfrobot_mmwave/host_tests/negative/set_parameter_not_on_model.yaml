# expect: 'trigger_range' is not available on the SEN0395
packages:
  base: !include _base.yaml
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
dfrobot_mmwave:
  id: radar
  model: SEN0395
interval:
  - interval: 1h
    then:
      - dfrobot_mmwave.set_parameter:
          id: radar
          parameter: trigger_range
          value: 2
